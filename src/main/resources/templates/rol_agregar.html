<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agregar Rol</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
  </head>
  <body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="tarjeta-contenedor">
      <div class="cabecera-logo">
      <img th:src="@{/imagenes/logo.jpeg}" alt="Logo de la red social" class="img-fluid w-25">
        <h1 class="text-lg font-bold">Registro Rol</h1>
      </div>

      <div class="contenido-principal">
        <h2 class="titulo-seccion">Agregar Nuevo Rol</h2>

        <form th:action="@{/rol_agregar}" th:object="${rol}" class="formulario" method="post">
          <div class="rejilla-formulario">
            <div class="campo">
              <label for="nom_rol" class="etiqueta"
                >Nombre Del Rol</label>
              <input
                type="text"
                id="nom_rol"
                name="nom_rol" th:field="*{nom_rol}"
                class="entrada"
              />
              <span class="error-message"></span>
            </div>
            <div class="campo">
              <label for="des_rol" class="etiqueta"
                >Descripcion del Rol</label>
                <textarea id="des_rol" name="des_rol" th_field="*{des_rol}" class="entrada" maxlength="100"></textarea>
              <span class="error-message"></span>
            </div>
            <div class="campo">
              <label for="est_fan_page" class="etiqueta">Estatus</label>
              <select id="est_fan_page" name="est_fan_page" th:field="*{est_rol}" class="entrada" required>
                <option value="">Seleccione...</option>
                <option value="A">Activo</option>
                <option value="I">Inactivo</option>
              </select>
              <span class="error-message"></span>
            </div>
          </div>
          <div class="contenedor-botones">
            <button type="submit" class="boton-accion">Guardar Registro</button>
            <a th_href='@{/rol}' class="boton-secundario">Volver</a>
          </div>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"crossorigin="anonymous"></script>  
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script th:inline="javascript">
      // Obtener el valor del mensaje desde Thymeleaf
      const mensaje = [[${mensaje}]];

      if (mensaje === "exito") {
          Swal.fire({
              title: "¡Logrado!",
              text: "El rol se ha registrado correctamente.",
              icon: "success",
              confirmButtonColor: "#3085d6"
          });
      } else if (mensaje === "error") {
          Swal.fire({
              title: "Error",
              text: "No se pudo realizar la inserción. Inténtalo de nuevo.",
              icon: "error",
              confirmButtonColor: "#d33"
          });
      }
  </script>
  </body>
</html>
